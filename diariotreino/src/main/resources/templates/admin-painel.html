<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Gerencial - Fichas</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/fav-icon.png}">
</head>
<body>
<div class="app-layout">
    <nav th:replace="~{fragments/menu :: sidebar}"></nav>
    <main class="main-content">
        <div class="dashboard-container">
            <div class="header">
                <h2>Painel de Fichas de Treino</h2>
                <a th:href="@{/admin/nova-ficha}" class="btn-nova-ficha">+ Nova Ficha</a>
            </div>

            <p style="color: #666; margin-bottom: 20px;">Selecione um aluno abaixo para visualizar, criar ou editar as suas fichas de treino.</p>

            <!-- Busca (atualizei a aparencia da barra, a lógica é a mesma) -->
            <div class="search-container">
                <form th:action="@{/admin/painel}" method="GET" class="search-form">
                    <div class="search-input-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" name="busca" th:value="${busca}" placeholder="Buscar por nome do aluno...">
                    </div>
                    <button type="submit" class="btn-buscar">Buscar</button>
                    <a th:href="@{/admin/painel}" class="btn-limpar">Limpar</a>
                </form>
            </div>

            <div th:if="${busca}" style="background-color: #d1ecf1; padding: 1rem; border-radius: 5px; margin-bottom: 1.5rem; border-left: 4px solid #17a2b8;">
                <p>Resultados para: <strong th:text="${busca}"></strong> (<span th:text="${#lists.size(alunos)}"></span> aluno(s))</p>
            </div>


            <table style="width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px;">
                <thead>
                <tr style="background-color: var(--cor-secundaria); color: white; text-align: left;">
                    <th style="padding: 12px; border-top-left-radius: 10px;">Nome do Aluno</th>
                    <th style="padding: 12px; text-align: center;">Status</th>
                    <th style="padding: 12px; text-align: center; border-top-right-radius: 10px;">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="aluno : ${alunos}">
                    <td style="padding: 12px; border-bottom: 1px solid #ddd; font-weight: 600;" th:text="${aluno.nome}"></td>
                    <td style="padding: 12px; border-bottom: 1px solid #ddd; text-align: center; font-weight: bold;"
                        th:text="${aluno.ativo} ? 'Ativo' : 'Suspenso'"
                        th:styleappend="${aluno.ativo} ? 'color: #28a745;' : 'color: #dc3545;'"></td>
                    <td style="padding: 12px; border-bottom: 1px solid #ddd; text-align: center;">
                        <a th:href="@{/admin/fichas-aluno/{id}(id=${aluno.id})}" class="btn btn-sm" style="background-color: var(--cor-secundaria); color: white;">Ver Fichas</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(alunos)}" style="text-align: center; padding: 20px; color: #666;">
                <p th:if="${busca}">Nenhum aluno encontrado para "<span th:text="${busca}"></span>"</p>
                <p th:unless="${busca}">Nenhum aluno cadastrado no sistema.</p>
            </div>

        </div>
    </main>
</div>
</body>
</html>
