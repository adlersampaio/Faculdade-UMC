<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Editar Ficha de Treino</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/fav-icon.png}">
</head>
<body>
<div class="app-layout">

    <nav th:replace="~{fragments/menu :: sidebar}"></nav>

    <main class="main-content">
        <div class="dashboard-container" style="max-width: 550px; margin-top: 40px;">
            <h2>Editar Ficha do Aluno</h2>

            <form th:action="@{/admin/atualizar-ficha}" method="post">
                <input type="hidden" name="id" th:value="${ficha.id}">

                <div class="form-group">
                    <label>Nome do Aluno (Apenas Leitura):</label>
                    <input type="text" th:value="${ficha.usuario.nome}" disabled
                           style="background-color: #e9ecef; color: #6c757d; cursor: not-allowed; border: 1px solid #ced4da;">
                </div>

                <div class="form-group">
                    <label>Nome do Treino:</label>
                    <input type="text" name="nomeTreino" th:value="${ficha.nomeTreino}" required>
                </div>

                <div class="form-group">
                    <label>Dia da Semana:</label>
                    <select name="diaDaSemana" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px;">
                        <option value="">-- Selecione o Dia --</option>
                        <option value="Segunda-feira" th:selected="${ficha?.diaDaSemana == 'Segunda-feira'}">Segunda-feira</option>
                        <option value="Terça-feira" th:selected="${ficha?.diaDaSemana == 'Terça-feira'}">Terça-feira</option>
                        <option value="Quarta-feira" th:selected="${ficha?.diaDaSemana == 'Quarta-feira'}">Quarta-feira</option>
                        <option value="Quinta-feira" th:selected="${ficha?.diaDaSemana == 'Quinta-feira'}">Quinta-feira</option>
                        <option value="Sexta-feira" th:selected="${ficha?.diaDaSemana == 'Sexta-feira'}">Sexta-feira</option>
                        <option value="Sábado" th:selected="${ficha?.diaDaSemana == 'Sábado'}">Sábado</option>
                        <option value="Domingo" th:selected="${ficha?.diaDaSemana == 'Domingo'}">Domingo</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-editar-form">Atualizar Ficha</button>
                    <a th:href="@{/admin/painel}" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
