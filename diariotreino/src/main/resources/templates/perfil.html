<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/fav-icon.png}">
</head>
<body>
<div class="app-layout">
    <nav th:replace="~{fragments/menu :: sidebar}"></nav>
    <main class="main-content">
        <div class="dashboard-container" style="max-width: 650px;">

            <h2>Meu Perfil</h2>
            <p style="text-align: center; color: #666; margin-bottom: 25px;">Gerencie suas informações cadastrais e sua foto de exibição.</p>

            <div th:if="${param.sucesso}" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold;">
                🎉 Perfil atualizado com sucesso!
            </div>

            <form th:action="@{/perfil/atualizar}" method="post" enctype="multipart/form-data" style="margin-top: 10px;">

                <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; gap: 15px;">

                    <div style="width: 130px; height: 130px; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 3px solid var(--cor-primaria); display: flex; justify-content: center; align-items: center; background-color: #eaeaea;">
                        <img th:if="${usuario.fotoPerfil != null}" th:src="${usuario.fotoPerfil}" alt="Foto de Perfil" style="width: 100%; height: 100%; object-fit: cover;">
                        <i th:unless="${usuario.fotoPerfil != null}" class="fas fa-user" style="font-size: 4rem; color: #aaa;"></i>
                    </div>

                    <div style="text-align: center;">
                        <label style="background-color: #6c757d; color: white; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;">
                            <i class="fas fa-camera"></i> Alterar Foto
                            <input type="file" name="foto" accept="image/*" style="display: none;">
                        </label>
                        <p style="font-size: 0.75rem; color: #888; margin-top: 5px;">Formatos aceitos: JPG, PNG. Máx: 2MB</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nome Completo:</label>
                    <input type="text" name="nome" th:value="${usuario.nome}" required placeholder="Seu nome completo">
                </div>

                <div class="form-group">
                    <label>E-mail de Acesso:</label>
                    <input type="email" name="email" th:value="${usuario.email}" required placeholder="seu.email@exemplo.com">
                </div>

                <div class="form-group">
                    <label>Telefone de Contato:</label>
                    <input type="text" name="telefone" th:value="${usuario.telefone}" placeholder="Ex: (11) 99999-9999">
                </div>

                <div class="form-group">
                    <label>Endereço Residencial:</label>
                    <input type="text" name="endereco" th:value="${usuario.endereco}" placeholder="Ex: Rua, Número, Bairro, Cidade">
                </div>

                <div th:if="${erro}" style="color: #dc3545; background-color: #f8d7da; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; font-weight: bold;">
                    <p style="margin:0;" th:text="${erro}"></p>
                </div>

                <div class="form-actions" style="margin-top: 30px;">
                    <button type="submit" class="btn-salvar" style="width: 100%; height: 50px;">Salvar Alterações</button>
                </div>
            </form>

        </div>
    </main>
</div>
</body>
</html>
