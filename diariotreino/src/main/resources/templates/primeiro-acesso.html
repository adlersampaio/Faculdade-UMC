<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Primeiro Acesso - Mudar Senha</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/fav-icon.png}">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card" style="width: 420px;">

        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img th:src="@{/images/logo-login.png}" alt="Muscle Fit Logo" style="max-width: 180px; height: auto;">
        </div>

        <h3 style="text-align: center; color: var(--cor-secundaria); margin-bottom: 10px; font-size: 1.5rem;">Atualize sua Senha</h3>
        <p style="text-align: center; color: #666; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5;">
            Olá, <strong th:text="${session.usuarioLogado.nome}"></strong>! <br>
            Como este é o seu primeiro acesso, por favor, defina uma nova senha pessoal para garantir sua segurança.
        </p>

        <form th:action="@{/salvar-nova-senha}" method="post">

            <div class="form-group">
                <label>Nova Senha:</label>
                <input type="password" name="novaSenha" required placeholder="Minimo 12 caracteres e 1 especial"
                       minlength="12" pattern="^(?=.*[^A-Za-z0-9]).{12,}$"
                       title="Use no minimo 12 caracteres e pelo menos 1 caractere especial">
            </div>

            <div class="form-group">
                <label>Confirmar Nova Senha:</label>
                <input type="password" name="confirmarSenha" required placeholder="Repita a senha digitada"
                       minlength="12" pattern="^(?=.*[^A-Za-z0-9]).{12,}$"
                       title="Use no minimo 12 caracteres e pelo menos 1 caractere especial">
            </div>

            <div th:if="${erro}" style="color: #dc3545; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 0.9rem;">
                <p style="margin: 0;" th:text="${erro}"></p>
            </div>

            <button type="submit" class="btn-login" style="margin-top: 10px;">Salvar e Entrar</button>

        </form>
    </div>
</div>

</body>
</html>
