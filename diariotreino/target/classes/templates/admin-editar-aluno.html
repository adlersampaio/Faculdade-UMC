<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Aluno</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/fav-icon.png}">
</head>
<body>
<div class="app-layout">
    <nav th:replace="~{fragments/menu :: sidebar}"></nav>

    <main class="main-content">
        <div class="dashboard-container" style="max-width: 550px; margin-top: 40px;">
            <h2>Editar Aluno</h2>

            <form th:action="@{/admin/atualizar-aluno}" method="post">
                <input type="hidden" name="id" th:value="${aluno.id}">

                <div class="form-group">
                    <label>Nome Completo:</label>
                    <input type="text" name="nome" th:value="${aluno.nome}" required>
                </div>

                <div class="form-group">
                    <label>E-mail:</label>
                    <input type="email" name="email" th:value="${aluno.email}" required>
                </div>

                <div class="form-group">
                    <label>Gerar Nova Senha Provisória:</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="checkbox" id="resetSenha" name="resetSenha" style="width: 20px; height: 20px; cursor: pointer;" onchange="toggleSenhaInput()">
                        <input type="password" id="novaSenha" name="novaSenha" placeholder="Digite a nova senha provisória" disabled style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                    <small style="color: #666; margin-top: 5px; display: block;">Marque a caixa para definir uma nova senha provisória para o aluno</small>
                </div>

                <div th:if="${erro}" style="color: #dc3545; background-color: #f8d7da; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; font-weight: bold;">
                    <p style="margin:0;" th:text="${erro}"></p>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-editar-form">Atualizar Aluno</button>
                    <a th:href="@{/admin/alunos}" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    function toggleSenhaInput() {
        const checkbox = document.getElementById('resetSenha');
        const senhaInput = document.getElementById('novaSenha');

        if (checkbox.checked) {
            senhaInput.disabled = false;
            senhaInput.focus();
        } else {
            senhaInput.disabled = true;
            senhaInput.value = '';
        }
    }
</script>
</body>
</html>
