<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Aluno</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/fav-icon.png}">
</head>
<body>
<div class="app-layout">
    <nav th:replace="~{fragments/menu :: sidebar}"></nav>

    <main class="main-content">
        <div class="dashboard-container" style="max-width: 450px;">
            <h2>Cadastrar Novo Aluno</h2>

            <form th:action="@{/admin/salvar-aluno}" method="post">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" class="form-control" th:value="${nome}" required placeholder="Ex: Joao Silva">
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-control" th:value="${email}" required placeholder="email@exemplo.com">
                </div>

                <div class="form-group">
                    <label for="senha">Senha Provisoria:</label>
                    <input type="password" id="senha" name="senha" class="form-control" required>
                </div>

                <div th:if="${erro}" style="color: #dc3545; background-color: #f8d7da; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; font-weight: bold;">
                    <p style="margin:0;" th:text="${erro}"></p>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Salvar Aluno</button>
                    <a th:href="@{/admin/alunos}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
