<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Personal</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/fav-icon.png}">
</head>
<body>
<div class="app-layout">
    <nav th:replace="~{fragments/menu :: sidebar}"></nav>
    <main class="main-content">
        <div class="dashboard-container" style="max-width: 450px;">
            <h2>Cadastrar Novo Personal</h2>
            <form th:action="@{/admin/salvar-personal}" method="post">
                <div class="form-group">
                    <label>Nome Completo:</label>
                    <input type="text" name="nome" th:value="${nome}" required>
                </div>
                <div class="form-group">
                    <label>E-mail Corporativo:</label>
                    <input type="email" name="email" th:value="${email}" required>
                </div>
                <div class="form-group">
                    <label>Senha Provisoria:</label>
                    <input type="password" name="senha" required>
                </div>

                <div th:if="${erro}" style="color: #dc3545; background-color: #f8d7da; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; font-weight: bold;">
                    <p style="margin:0;" th:text="${erro}"></p>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-salvar">Salvar Personal</button>
                    <a th:href="@{/admin/personais}" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
