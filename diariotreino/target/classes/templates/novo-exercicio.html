<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Novo Exercício</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/images/fav-icon.png}">
</head>
<body>
<div class="app-layout">
    <nav th:replace="~{fragments/menu :: sidebar}"></nav>
    <main class="main-content">
        <div class="container" style="max-width: 600px; padding: 2.5rem;">
            <h2>Adicionar Exercício</h2>
            <p style="text-align: center; color: #666; margin-bottom: 1.5rem;">Preencha os dados do novo exercício para a ficha.</p>

            <form th:action="@{/ficha/{id}/salvar-exercicio(id=${ficha.id})}" method="post" style="margin-top: 0;">

                <div class="form-group">
                    <label>Nome do Exercício:</label>
                    <input type="text" name="nomeExercicio" required placeholder="Ex: Supino Reto com Halteres">
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Séries:</label>
                        <input type="number" name="series" required placeholder="Ex: 4">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Repetições:</label>
                        <input type="number" name="repeticoes" required placeholder="Ex: 12">
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Carga/Peso (Opcional):</label>
                        <input type="text" name="peso" placeholder="Ex: 20kg">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Descanso (Opcional):</label>
                        <input type="text" name="descanso" placeholder="Ex: 60s">
                    </div>
                </div>

                <div class="form-group">
                    <label>Observações (Opcional):</label>
                    <textarea name="observacoes" rows="3" placeholder="Ex: Focar na descida (fase excêntrica)"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primario">Salvar Exercício</button>
                    <a href="javascript:history.back()" class="btn btn-secundario">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
