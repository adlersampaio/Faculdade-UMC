<!DOCTYPE html>
<!--
    Projeto: Inscrição para Evento - Atividade 1 - M1
    Formulário de inscrição (View) - envia os dados para insc_cad.jsp
    Autores: Gabriel Gomes, Adler Augusto Vendramel Sampaio, Julia Nascimento Ignácio
-->
<html>
    <head>
        <title>Web App Evento</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h2>Inscrição para o Evento (CADASTRAR)</h2>
        <form method="post" action="insc_cad.jsp">
            <!-- O Identificador (pk_id) e a data da inscrição são gerados pelo banco -->
            <p>Nome completo <input type="text" name="nome" maxlength="60" required> </p>
            <p>E-mail <input type="email" name="email" maxlength="80" required> </p>
            <p>Telefone <input type="tel" name="telefone" maxlength="15" placeholder="(11) 99999-9999" required> </p>
            <p>CPF <input type="text" name="cpf" maxlength="14" placeholder="000.000.000-00" required> </p>
            <p>Data de nascimento <input type="date" name="data_nasc" required> </p>
            <p>Empresa / Instituição <input type="text" name="empresa" maxlength="60" required> </p>
            <p>Cargo <input type="text" name="cargo" maxlength="40" required> </p>
            <p>Cidade <input type="text" name="cidade" maxlength="40" required> </p>
            <p>Estado
                <select name="estado" required>
                    <option value="">Selecione</option>
                    <option>AC</option> <option>AL</option> <option>AP</option> <option>AM</option>
                    <option>BA</option> <option>CE</option> <option>DF</option> <option>ES</option>
                    <option>GO</option> <option>MA</option> <option>MT</option> <option>MS</option>
                    <option>MG</option> <option>PA</option> <option>PB</option> <option>PR</option>
                    <option>PE</option> <option>PI</option> <option>RJ</option> <option>RN</option>
                    <option>RS</option> <option>RO</option> <option>RR</option> <option>SC</option>
                    <option selected>SP</option> <option>SE</option> <option>TO</option>
                </select>
            </p>
            <p>Modalidade
                <input type="radio" name="modalidade" value="Presencial" checked> Presencial
                <input type="radio" name="modalidade" value="Online"> Online
            </p>
            <p> <input type="submit" value="Inscrever">
                <input type="reset" value="Limpar">
            </p>
        </form>
        <p> <a href="../index.html"> Voltar ao menu </a> </p>
    </body>
</html>
